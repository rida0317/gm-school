<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="24" fill="url(#markBg)"/>

  <!-- Markers Box / Pack -->
  <g transform="translate(60, 50)">
    <!-- Marker 1: Blue -->
    <g transform="translate(30, 20) rotate(-15)">
      <rect x="0" y="0" width="30" height="150" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <rect x="0" y="30" width="30" height="80" fill="#ffffff"/>
      <text x="15" y="75" fill="#1e3a8a" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" transform="rotate(90, 15, 75)">BLEU</text>
      <!-- Nib / Tip -->
      <polygon points="5,0 25,0 15,-20" fill="#1d4ed8"/>
      <!-- Cap top ring -->
      <rect x="2" y="115" width="26" height="25" rx="5" fill="#1e40af"/>
    </g>

    <!-- Marker 2: Black -->
    <g transform="translate(100, 10) rotate(-5)">
      <rect x="0" y="0" width="30" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="30" width="30" height="80" fill="#ffffff"/>
      <text x="15" y="75" fill="#0f172a" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" transform="rotate(90, 15, 75)">NOIR</text>
      <polygon points="5,0 25,0 15,-20" fill="#0f172a"/>
      <rect x="2" y="115" width="26" height="25" rx="5" fill="#1e293b"/>
    </g>

    <!-- Marker 3: Red -->
    <g transform="translate(170, 15) rotate(5)">
      <rect x="0" y="0" width="30" height="150" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
      <rect x="0" y="30" width="30" height="80" fill="#ffffff"/>
      <text x="15" y="75" fill="#991b1b" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" transform="rotate(90, 15, 75)">ROUGE</text>
      <polygon points="5,0 25,0 15,-20" fill="#b91c1c"/>
      <rect x="2" y="115" width="26" height="25" rx="5" fill="#991b1b"/>
    </g>

    <!-- Marker 4: Green -->
    <g transform="translate(240, 30) rotate(15)">
      <rect x="0" y="0" width="30" height="150" rx="10" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
      <rect x="0" y="30" width="30" height="80" fill="#ffffff"/>
      <text x="15" y="75" fill="#166534" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" transform="rotate(90, 15, 75)">VERT</text>
      <polygon points="5,0 25,0 15,-20" fill="#15803d"/>
      <rect x="2" y="115" width="26" height="25" rx="5" fill="#15803d"/>
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(130, 240)">
    <rect width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1"/>
    <text x="70" y="19" fill="#ffffff" font-size="10" font-weight="900" font-family="sans-serif" text-anchor="middle">WHITEBOARD MARKERS</text>
  </g>
</svg>
