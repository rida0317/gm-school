<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="24" fill="url(#projBg)"/>

  <!-- Light Beam projection -->
  <polygon points="175,150 400,60 400,240" fill="url(#beamGrad)"/>

  <!-- Projector Body -->
  <g transform="translate(50, 100)">
    <!-- Base feet -->
    <rect x="25" y="98" width="18" height="12" rx="4" fill="#475569"/>
    <rect x="180" y="98" width="18" height="12" rx="4" fill="#475569"/>

    <!-- Main Chassis -->
    <rect x="10" y="20" width="200" height="80" rx="16" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Top Controls and vents -->
    <rect x="25" y="32" width="60" height="6" rx="3" fill="#64748b"/>
    <circle cx="105" cy="35" r="4" fill="#0284c7"/>
    <circle cx="120" cy="35" r="4" fill="#64748b"/>
    <circle cx="135" cy="35" r="4" fill="#64748b"/>

    <!-- Ventilation Grill -->
    <line x1="25" y1="55" x2="85" y2="55" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="65" x2="85" y2="65" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="75" x2="85" y2="75" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lens Ring -->
    <circle cx="155" cy="60" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="155" cy="60" r="24" fill="url(#lensGrad)"/>
    <circle cx="147" cy="52" r="6" fill="#ffffff" opacity="0.6"/>

    <!-- EPSON / Brand Tag -->
    <text x="55" y="90" fill="#0f172a" font-size="9" font-weight="900" font-family="sans-serif">EPSON 3LCD</text>
  </g>
</svg>
