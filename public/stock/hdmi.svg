<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="24" fill="url(#bgGrad)"/>

  <!-- Tech Grid Lines -->
  <path d="M 50,0 L 50,300 M 150,0 L 150,300 M 250,0 L 250,300 M 350,0 L 350,300" stroke="#334155" stroke-width="1" opacity="0.15" />
  <path d="M 0,75 L 400,75 M 0,150 L 400,150 M 0,225 L 400,225" stroke="#334155" stroke-width="1" opacity="0.15" />

  <!-- Glowing Cable Loops -->
  <path d="M 60,230 C 100,290 280,270 320,200 C 350,140 260,110 200,160 C 150,200 80,180 80,120" fill="none" stroke="url(#cableGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 60,230 C 100,290 280,270 320,200 C 350,140 260,110 200,160 C 150,200 80,180 80,120" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Left HDMI Connector Head -->
  <g transform="translate(60, 90)" filter="url(#glow)">
    <!-- Plug Body -->
    <rect x="0" y="0" width="80" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="8" width="50" height="30" rx="4" fill="#0f172a"/>
    <!-- HDMI Text -->
    <text x="40" y="27" fill="#38bdf8" font-size="11" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">HDMI 4K</text>
    <!-- Gold Connector Pin -->
    <path d="M 80,8 L 105,8 L 110,14 L 110,32 L 105,38 L 80,38 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
    <rect x="86" y="14" width="16" height="18" rx="2" fill="#0f172a"/>
    <!-- Connector Teeth -->
    <line x1="88" y1="18" x2="100" y2="18" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="88" y1="23" x2="100" y2="23" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="88" y1="28" x2="100" y2="28" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- High Speed 4K Badge -->
  <g transform="translate(255, 45)">
    <rect width="110" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="20" fill="#38bdf8" font-size="11" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">⚡ ULTRA HD 4K</text>
  </g>
</svg>
