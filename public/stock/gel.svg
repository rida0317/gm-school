<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="24" fill="url(#gelBg)"/>

  <!-- Large 5L Container / Canister -->
  <g transform="translate(130, 40)">
    <!-- Dispenser Pump Top -->
    <rect x="60" y="0" width="20" height="25" rx="4" fill="#0f766e"/>
    <path d="M 60,10 L 20,15 L 20,25 L 60,20 Z" fill="#0d9488"/>
    <!-- Neck -->
    <rect x="50" y="25" width="40" height="20" rx="6" fill="#cbd5e1"/>
    
    <!-- Handle -->
    <path d="M 120,60 C 160,60 160,140 120,140" fill="none" stroke="#0d9488" stroke-width="18" stroke-linecap="round"/>

    <!-- Main 5L Jug Body -->
    <rect x="15" y="45" width="110" height="180" rx="22" fill="url(#bottleGrad)" stroke="#2dd4bf" stroke-width="2"/>
    
    <!-- Liquid Level Line -->
    <path d="M 15,90 Q 70,100 125,90 L 125,225 L 15,225 Z" fill="#0d9488" opacity="0.3"/>

    <!-- Label Front -->
    <rect x="25" y="100" width="90" height="100" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <!-- Medical Cross -->
    <circle cx="70" cy="130" r="16" fill="#0f766e"/>
    <rect x="66" y="120" width="8" height="20" rx="2" fill="#ffffff"/>
    <rect x="60" y="126" width="20" height="8" rx="2" fill="#ffffff"/>

    <text x="70" y="162" fill="#0f766e" font-size="10" font-weight="900" font-family="sans-serif" text-anchor="middle">GEL HYDRO</text>
    <text x="70" y="174" fill="#14b8a6" font-size="8" font-weight="800" font-family="sans-serif" text-anchor="middle">5 LITRES &bull; 99.9%</text>
    <text x="70" y="188" fill="#64748b" font-size="7" font-weight="700" font-family="sans-serif" text-anchor="middle">DÉSINFECTION</text>
  </g>
</svg>
